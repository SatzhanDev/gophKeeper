syntax = "proto3";

package secret.v1;

import "google/api/annotations.proto";

option go_package = "github.com/SatzhanDev/gophKeeper/api/proto/secret/v1;secretv1";

// SecretType — тип приватных данных. Значения совпадают с model.SecretType
// на сервере (SECRET_TYPE_UNSPECIFIED = 0 намеренно не используется).
enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_LOGIN_PASSWORD = 1;
  SECRET_TYPE_TEXT = 2;
  SECRET_TYPE_BINARY = 3;
  SECRET_TYPE_CARD = 4;
}

message Secret {
  int64 id = 1;
  SecretType type = 2;
  bytes data = 3;
  string metadata = 4;
  int32 version = 5;
  int64 created_at = 6; // unix seconds
  int64 updated_at = 7; // unix seconds
}

message CreateSecretRequest {
  SecretType type = 1;
  bytes data = 2;
  string metadata = 3;
}
message CreateSecretResponse {
  int64 id = 1;
}

message GetSecretRequest {
  int64 id = 1;
}
message GetSecretResponse {
  Secret secret = 1;
}

message ListSecretsRequest {}
message ListSecretsResponse {
  repeated Secret secrets = 1;
}

message UpdateSecretRequest {
  int64 id = 1;
  bytes data = 2;
  string metadata = 3;
  int32 version = 4; // версия, которую клиент считает текущей
}
message UpdateSecretResponse {
  int32 version = 1; // новая версия после обновления
}

message DeleteSecretRequest {
  int64 id = 1;
}
message DeleteSecretResponse {}

// SecretService отвечает за хранение и выдачу приватных данных владельца.
// Все методы требуют авторизации (JWT в metadata запроса).
service SecretService {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse) {
    option (google.api.http) = {
      post: "/v1/secrets"
      body: "*"
    };
  }
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse) {
    option (google.api.http) = {
      get: "/v1/secrets/{id}"
    };
  }
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = {
      get: "/v1/secrets"
    };
  }
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse) {
    option (google.api.http) = {
      put: "/v1/secrets/{id}"
      body: "*"
    };
  }
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = {
      delete: "/v1/secrets/{id}"
    };
  }
}